- name: Ensure the apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true
- name: Ensure the NodeSource apt key is present
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: "0644"
  become: true
- name: Ensure the NodeSource apt repository is present
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/nodesource.asc]
      https://deb.nodesource.com/node_{{ node_major_version }}.x nodistro main
    filename: nodesource
    state: present
    update_cache: true
  become: true
- name: Ensure Node.js is installed
  ansible.builtin.apt:
    name: "nodejs={{ node_major_version }}.*"
    state: present
  become: true
