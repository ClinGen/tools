# Copy this file to inventory.ini and fill in the server IP addresses. Git ignores
# inventory.ini.

[test_server]
<test-server-ip>

[prod_server]
<prod-server-ip>

[all:vars]
ansible_user=ubuntu
repo_url=https://github.com/ClinGen/tools
repo_dir=/home/ubuntu/tools
repo_branch=main

[test_server:vars]
ansible_ssh_private_key_file=~/.ssh/tools_ansible_test_ed25519
subdomain="tools-test"

[prod_server:vars]
ansible_ssh_private_key_file=~/.ssh/tools_ansible_prod_ed25519
subdomain="tools"
